apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: social-media-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: social-media-platform/frontend:latest
          ports: [{ containerPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: social-media-platform
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000 }]
