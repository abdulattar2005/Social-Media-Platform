apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service
  namespace: social-media-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: post-service }
  template:
    metadata:
      labels: { app: post-service }
    spec:
      containers:
        - name: post-service
          image: social-media-platform/post-service:latest
          ports: [{ containerPort: 8082 }]
          envFrom:
            - configMapRef: { name: platform-config }
          env:
            - name: DB_NAME
              value: "postdb"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: platform-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: DB_PASSWORD } }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: platform-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: RABBITMQ_PASSWORD } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "500m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: post-service
  namespace: social-media-platform
spec:
  selector: { app: post-service }
  ports: [{ port: 8082, targetPort: 8082 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: post-service-hpa
  namespace: social-media-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: post-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
